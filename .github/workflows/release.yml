name: Release

on:
  push:

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.13.0"
      - name: Install dependencies
        run: yarn
      - name: Build
        run: yarn app:distWindows --publish=never
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: emuze-windows
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/emuze*.exe
            dist/emuze*.exe.blockmap
            dist/latest.yml
            emulators/emulators-windows.json

  build_linux:
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@v6
      - name: Install Dependencies
        run: /bin/sh ./.github/scripts/get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./.github/scripts/make-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: emuze-linux
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/emuze*.AppImage
            dist/emuze*.AppImage.zsync
            emulators/emulators-linux.json

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [build_windows, build_linux]
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Release build
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/emuze-Setup-*.exe
            dist/emuze-Setup-*.exe.blockmap
            dist/emuze-*.AppImage
            dist/latest.yml
            dist/latest-linux.yml
            emulators/emulators-windows.json
            emulators/emulators-linux.json
