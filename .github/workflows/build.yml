name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_linux:
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2
      - name: Install Dependencies
        run: /bin/sh ./.github/scripts/get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./.github/scripts/make-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: emuze-linux
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/emuze*.AppImage
            dist/emuze*.AppImage.zsync
            emulators/emulators-linux.json
